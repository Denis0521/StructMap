<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:system-ui,"Noto Sans TC",sans-serif;background:#f4f1ea;overflow:hidden;color:#1b3a57}
button{font-family:inherit;cursor:pointer}[hidden]{display:none!important}
#top{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#27496b,#1b3a57);color:#fff;z-index:10;box-shadow:0 2px 8px #0004}
#top button{border:0;background:#ffffff1f;color:#fff;border-radius:8px;height:34px;padding:0 12px;font-size:14px}#top button:disabled{opacity:.3}#top .ic{width:36px;padding:0;font-size:19px}
#title{flex:1;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px}
#cv{position:fixed;top:48px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 48px);touch-action:none;background-image:radial-gradient(#cfc8b8 1px,transparent 1px);background-size:20px 20px}
.nd rect{fill:#fff;stroke:#222;stroke-width:2}.nd.sel rect{stroke:#d9480f;stroke-width:3.5}.nd.from rect{fill:#fff3bf}
.nd text{text-anchor:middle;dominant-baseline:central;fill:var(--tf,#111);pointer-events:none;user-select:none}
.eg{fill:none;stroke:#222;stroke-width:2}.eg.sel{stroke:#d9480f;stroke-width:3.5}.hit{fill:none;stroke:transparent;stroke-width:18}
#mode{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#ffd54a;color:#4a3b00;padding:7px 16px;border-radius:20px;font-size:14px;font-weight:600;box-shadow:0 2px 8px #0003;z-index:9;white-space:nowrap}
#empty{position:fixed;top:45%;left:0;right:0;text-align:center;color:#8a8574;font-size:16px;pointer-events:none}
#fabs{position:fixed;right:12px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:7}
.fab{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#1b3a57;box-shadow:0 2px 8px #0004;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0}
.fab.pri{background:#1971c2;color:#fff;width:52px;height:52px;align-self:flex-end}.fab.on{background:#ffd54a}
.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
#pn{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px #0003;padding:8px 12px calc(10px + env(safe-area-inset-bottom));max-height:48vh;overflow-y:auto;z-index:8}
.grab{width:40px;height:4px;background:#cfd6de;border-radius:2px;margin:0 auto 8px}
#tx{width:100%;border:1px solid #cdd5df;border-radius:10px;padding:8px 10px;font-size:17px;resize:none;font-family:inherit;color:#111}
.chips{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.chips button{flex:none;padding:8px 13px;border:1px solid #cdd5df;border-radius:18px;background:#f5f8fb;font-size:14px;color:#1b3a57}.chips .danger{color:#c92a2a}.chips .on{background:#1b3a57;color:#fff;border-color:#1b3a57}
.seg{display:flex;background:#e9eef3;border-radius:10px;padding:3px;flex:1}.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:14px;color:#334}.seg .on{background:#fff;box-shadow:0 1px 3px #0003;font-weight:600}
.rw{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}.rw>b{width:3em;font-weight:500;color:#667;flex:none}.rw input[type=range]{flex:1}.rw select{flex:1;font-size:15px;padding:6px;border-radius:8px}
.sws{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px}.sw{width:30px;height:30px;border-radius:50%;border:2px solid #b8c2cc;padding:0;flex:none}.sw.cur{border-color:#1971c2;box-shadow:0 0 0 2px #a5d8ff}
#menu{position:fixed;top:52px;min-width:170px;background:#fff;border-radius:10px;box-shadow:0 6px 24px #0005;z-index:20;overflow:hidden}#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 16px;font-size:15px;color:#1b3a57;border-bottom:1px solid #eef1f4}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1b3a57e8;color:#fff;padding:8px 16px;border-radius:18px;font-size:14px;z-index:30}
dialog{border:0;border-radius:12px;padding:16px;width:min(92vw,420px)}dialog::backdrop{background:#0006}dialog button{padding:8px 13px;border-radius:8px;border:1px solid #aab;background:#fff;font-size:14px;margin:4px 4px 0 0}
.lr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #ddd;gap:6px}
#pb{display:none}
@media (min-width:800px){#pn{left:auto;right:76px;bottom:16px;width:340px;border-radius:16px;max-height:80vh}#fabs{bottom:16px!important}}
@media print{html,body{overflow:visible;background:#fff}body>*:not(#pb){display:none!important}#pb{display:block}#pb svg{width:100%;height:auto;max-height:190mm}}
</style></head><body>
<header id="top"><button id="bFile">檔案</button><div id="title"></div><button id="bUn" class="ic">↶</button><button id="bRe" class="ic">↷</button><button id="bExp">匯出</button></header>
<div id="mode" hidden></div><div id="empty" hidden>點右下角 ＋ 新增方框</div>
<svg id="cv"><g id="w"></g></svg>
<div id="fabs">
<button id="bAdd" class="fab pri"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<button id="bLink" class="fab"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.5 8.5l7 7"/></svg></button>
<button id="bZi" class="fab">＋</button><button id="bZo" class="fab">－</button>
<button id="bFit" class="fab"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<section id="pn" hidden><div class="grab"></div>
<div id="pnNode"><textarea id="tx" rows="2" placeholder="輸入文字…"></textarea>
<div class="chips"><button id="aChild">＋子項</button><button id="aSib">＋同層</button><button id="aDup">複製</button><button id="aDir">直/橫</button><button id="aDel" class="danger">刪除</button></div>
<div class="seg" id="tabs" style="margin-bottom:4px"><button data-t="0">方框</button><button data-t="1">文字</button></div>
<div id="t0"><div class="rw"><b>填色</b><div class="sws" id="sFill"></div></div>
<div class="rw"><b>圓角</b><input type="range" id="sR" min="0" max="40"></div>
<div class="rw"><b>陰影</b><div class="seg" id="sSh"><button data-v="0">無</button><button data-v="1">柔和</button><button data-v="2">立體</button></div></div></div>
<div id="t1"><div class="rw"><b>字體</b><select id="sFf"><option value="0">預設黑體</option><option value="1">明體</option><option value="2">楷體</option><option value="3">圓體</option><option value="4">芫荽體</option></select><div class="chips" style="margin:0"><button id="sB">粗體</button></div></div>
<div class="rw"><b>字級</b><input type="range" id="sZ" min="12" max="44"></div>
<div class="rw"><b>效果</b><div class="seg" id="sTe"><button data-v="0">無</button><button data-v="4">陰影</button><button data-v="3">發光</button></div></div>
<div class="rw"><b>顏色</b><div class="sws" id="sTc"></div></div></div>
<div class="chips"><button id="sAll">把樣式套用到全部方框</button></div></div>
<div id="pnEdge"><div class="rw"><b>線色</b><div class="sws" id="eCol"></div></div>
<div class="chips"><button id="eArw">箭頭</button><button id="eRev">反向</button><button id="eDel" class="danger">刪除連線</button></div></div>
</section>
<div id="menu" hidden></div><div id="toast" hidden></div>
<dialog id="dL"><b>我的結構</b><div id="fl"></div><button id="fClose">關閉</button></dialog>
<input type="file" id="fi" accept=".json,application/json" hidden><div id="pb"></div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),W=$('w');
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,view={x:40,y:20,k:1},sel=null,mode=0,linkFrom=null,undo=[],redo=[],last='',tab=0;
const N=id=>S.nodes.find(n=>n.id==id),curN=()=>sel&&sel.t=='n'?N(sel.id):null;
const FF=["system-ui,sans-serif","'Noto Serif TC','Songti TC','PMingLiU',serif","'LXGW WenKai TC','Kaiti TC','BiauKai','DFKai-SB',serif","'Huninn','Noto Sans TC',sans-serif","'Iansui','LXGW WenKai TC',cursive"];
function route(a,b){const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2,
dx=Math.abs(bx-ax)-(a.w+b.w)/2,dy=Math.abs(by-ay)-(a.h+b.h)/2;
if(dx>=dy){const s=bx>ax?1:-1,x1=ax+s*a.w/2,x2=bx-s*b.w/2,m=(x1+x2)/2;return{d:`M${x1} ${ay}H${m}V${by}H${x2}`,x:x2,y:by,u:s,v:0}}
const s=by>ay?1:-1,y1=ay+s*a.h/2,y2=by-s*b.h/2,m=(y1+y2)/2;return{d:`M${ax} ${y1}V${m}H${bx}V${y2}`,x:bx,y:y2,u:0,v:s}}
function plan(){const deg={};S.edges.forEach(e=>{deg[e.f]=(deg[e.f]||0)+1;deg[e.t]=(deg[e.t]||0)+1});
const P={},G={},cand={};
S.edges.forEach((e,i)=>{const a=N(e.f),b=N(e.t);if(!a||!b)return;const hub=deg[e.f]>=deg[e.t]?a:b,o=hub==a?b:a,g={};
if(o.x>=hub.x+hub.w)g.R=o.x-hub.x-hub.w;if(o.x+o.w<=hub.x)g.L=hub.x-o.x-o.w;if(o.y>=hub.y+hub.h)g.B=o.y-hub.y-hub.h;if(o.y+o.h<=hub.y)g.T=hub.y-o.y-o.h;
(cand[hub.id]=cand[hub.id]||[]).push({i,hub,o,g})});
for(const id in cand){let L=cand[id];
while(L.length){const cnt={},gs={};L.forEach(x=>{for(const s in x.g){cnt[s]=(cnt[s]||0)+1;gs[s]=(gs[s]||0)+x.g[s]}});
const ks=Object.keys(cnt);if(!ks.length)break;ks.sort((p,q)=>cnt[q]-cnt[p]||gs[q]-gs[p]);const best=ks[0];
const m=L.filter(x=>best in x.g);m.forEach(x=>{P[x.i]={hub:x.hub,o:x.o,s:best,k:id+best}});G[id+best]=m;L=L.filter(x=>!(best in x.g))}}
return{P,G}}
function geom(i,e,PL){const p=PL.P[i],a=N(e.f),b=N(e.t);if(!p)return route(a,b);
const h=p.hub,o=p.o,s=p.s,g=PL.G[p.k];let pts;
if(s=='R'||s=='L'){const x1=s=='R'?h.x+h.w:h.x,ex=s=='R'?o.x:o.x+o.w,xs=g.map(q=>s=='R'?q.o.x:q.o.x+q.o.w),near=s=='R'?Math.min(...xs):Math.max(...xs),tx=(x1+near)/2,hy=h.y+h.h/2,oy=o.y+o.h/2;pts=[[x1,hy],[tx,hy],[tx,oy],[ex,oy]]}
else{const y1=s=='B'?h.y+h.h:h.y,ey=s=='B'?o.y:o.y+o.h,ys=g.map(q=>s=='B'?q.o.y:q.o.y+q.o.h),near=s=='B'?Math.min(...ys):Math.max(...ys),ty=(y1+near)/2,hx=h.x+h.w/2,ox=o.x+o.w/2;pts=[[hx,y1],[hx,ty],[ox,ty],[ox,ey]]}
if(h==b)pts.reverse();
const n=pts.length,L=pts[n-1];let k=n-2;while(k>0&&pts[k][0]==L[0]&&pts[k][1]==L[1])k--;
return{d:'M'+pts.map(q=>q.join(' ')).join('L'),x:L[0],y:L[1],u:Math.sign(L[0]-pts[k][0]),v:Math.sign(L[1]-pts[k][1])}}
function arrow(r,c){const bx=r.x-r.u*14,by=r.y-r.v*14;return`<polygon points="${r.x},${r.y} ${bx+r.v*7},${by-r.u*7} ${bx-r.v*7},${by+r.u*7}" style="fill:${c}"/>`}
function txt(n,fs=18){const L=n.text.split('\n'),lh=Math.round(fs*1.22),cx=n.x+n.w/2,cy=n.y+n.h/2;let o='';
if(!n.v)L.forEach((s,i)=>o+=`<text x="${cx}" y="${cy+(i-(L.length-1)/2)*lh}">${esc(s)}</text>`);
else L.forEach((s,i)=>{const C=[...s],x=cx+((L.length-1)/2-i)*lh;C.forEach((ch,j)=>o+=`<text x="${x}" y="${cy+(j-(C.length-1)/2)*lh}">${esc(ch)}</text>`)});return o}
function inner(edit){let o='';const PL=plan();
S.edges.forEach((e,i)=>{const a=N(e.f),b=N(e.t);if(!a||!b)return;const r=geom(i,e,PL),c=e.c||'#222',sl=edit&&sel&&sel.t=='e'&&sel.i==i;
o+=`<path class="eg${sl?' sel':''}" ${sl?'':`style="stroke:${c}"`} d="${r.d}"/>`+(e.a?arrow(r,sl?'#d9480f':c):'')+(edit?`<path class="hit" data-e="${i}" d="${r.d}"/>`:'')});
S.nodes.forEach(n=>{const s=edit&&sel&&sel.t=='n'&&sel.id==n.id,fs=n.fs||18,r=n.r||0,sh=n.sh||0,tc=n.tc||'#111',te=n.te||0;
let bx='';
if(sh==2)bx+=`<rect x="${n.x+7}" y="${n.y+7}" width="${n.w}" height="${n.h}" rx="${r}" style="fill:#2b2b2b;stroke:#2b2b2b"/>`;
bx+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${r}" style="${n.c?`fill:${n.c};`:''}${sh==1?'filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))':''}"/>`;
let t='';
t+=`<g style="--tf:${tc}">${txt(n,fs)}</g>`;
const tg=`<g style="font-size:${fs}px;font-family:${FF[n.ff||0]};font-weight:${n.fb?700:400};${te==3?'filter:drop-shadow(0 0 3px #4dabf7) drop-shadow(0 0 6px #4dabf7);':''}${te==4?'filter:drop-shadow(2px 3px 2px rgba(0,0,0,.5));':''}">${t}</g>`;
o+=`<g class="nd${s?' sel':''}${edit&&linkFrom==n.id?' from':''}" data-n="${n.id}"><g>${bx}${tg}`+(s?`<circle data-h="${n.id}" cx="${n.x+n.w}" cy="${n.y+n.h}" r="11" fill="#d9480f"/>`:'')+`</g></g>`});
return o}
function bbox(){if(!S.nodes.length)return{x:0,y:0,w:400,h:300};const x1=Math.min(...S.nodes.map(n=>n.x)),y1=Math.min(...S.nodes.map(n=>n.y)),x2=Math.max(...S.nodes.map(n=>n.x+n.w)),y2=Math.max(...S.nodes.map(n=>n.y+n.h));return{x:x1,y:y1,w:x2-x1,h:y2-y1}}
function svgStr(k){const b=bbox(),p=24,w=b.w+2*p,h=b.h+2*p;
return{w,h,b,s:`<svg xmlns="http://www.w3.org/2000/svg" width="${w*k}" height="${h*k}" viewBox="${b.x-p} ${b.y-p} ${w} ${h}" style="font-family:'Noto Sans TC',sans-serif"><style>.nd rect{fill:#fff;stroke:#000;stroke-width:2}.nd text{text-anchor:middle;dominant-baseline:central;fill:var(--tf,#000)}.eg{fill:none;stroke:#000;stroke-width:2}</style>${inner(false)}</svg>`}}
function sample(){const m=(t,x,y,w=140,h=60,v=0)=>({id:uid(),text:t,x,y,w,h,v});
const c=m('紙怎麼來？',260,140),a=m('跟紙玩遊戲',260,240),b=m('紙有哪些特性',260,340);
const l=m('用紙玩遊戲',80,230,50,110,1),r=m('紙有哪幾種',440,230,50,110,1);
S={name:'範例',nodes:[c,a,b,l,r],edges:[{f:c.id,t:a.id},{f:a.id,t:b.id},{f:a.id,t:l.id},{f:a.id,t:r.id}]}}
function load(){try{const d=JSON.parse(localStorage.getItem('sd_cur'));if(d&&d.nodes){S=d;return}}catch(e){}sample()}
function save(){localStorage.setItem('sd_cur',JSON.stringify(S))}
async function saveFile(blob,name,type,ext){if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:type,accept:{[blob.type]:[ext]}}]});const w=await h.createWritable();await w.write(blob);await w.close();return}catch(e){if(e.name=='AbortError')return}}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
/* 歷史 */
function resetHist(){undo=[];redo=[];last=JSON.stringify(S)}
function commit(){const j=JSON.stringify(S);if(j!==last){undo.push(last);if(undo.length>60)undo.shift();redo=[];last=j;save()}}
function fixSel(){if(sel&&((sel.t=='n'&&!N(sel.id))||(sel.t=='e'&&!S.edges[sel.i])))sel=null}
function doUndo(){if(!undo.length)return;redo.push(last);last=undo.pop();S=JSON.parse(last);fixSel();save();render()}
function doRedo(){if(!redo.length)return;undo.push(last);last=redo.pop();S=JSON.parse(last);fixSel();save();render()}
/* 畫面 */
const segOn=(id,v)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',+b.dataset.v==v));
const cur=(id,c)=>document.querySelectorAll('#'+id+' .sw').forEach(b=>b.classList.toggle('cur',b.dataset.c==c));
function panel(){const n=curN(),e=sel&&sel.t=='e'?S.edges[sel.i]:null,p=$('pn');
p.hidden=!(n||e);$('pnNode').hidden=!n;$('pnEdge').hidden=!e;
if(n){if(document.activeElement!==$('tx'))$('tx').value=n.text;$('sR').value=n.r||0;$('sZ').value=n.fs||18;$('sFf').value=n.ff||0;$('sB').classList.toggle('on',!!n.fb);
segOn('sSh',n.sh||0);segOn('sTe',(n.te==3||n.te==4)?n.te:0);cur('sFill',n.c||'#ffffff');cur('sTc',n.tc||'#111111');
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.t==tab));$('t0').hidden=tab!=0;$('t1').hidden=tab!=1}
if(e){$('eArw').classList.toggle('on',!!e.a);cur('eCol',e.c||'#222222')}
$('fabs').style.bottom=((n||e)&&innerWidth<800?p.offsetHeight+12:16)+'px';$('empty').hidden=S.nodes.length>0}
function render(){W.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);W.innerHTML=inner(true);
$('bLink').classList.toggle('on',!!mode);$('mode').hidden=!mode;$('mode').textContent=linkFrom?'連線模式：點選終點方框':'連線模式：點選起點方框';
$('bUn').disabled=!undo.length;$('bRe').disabled=!redo.length;$('title').textContent=S.name+' ✎';panel()}
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1600)}
function vis(n){requestAnimationFrame(()=>{const r=cv.getBoundingClientRect(),ph=$('pn').hidden||innerWidth>=800?0:$('pn').offsetHeight,bot=view.y+(n.y+n.h)*view.k,top=view.y+n.y*view.k,lim=r.height-ph-16;
if(bot>lim)view.y+=lim-bot;else if(top<8)view.y+=8-top;render()})}
function pt(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-view.x)/view.k,y:(ev.clientY-r.top-view.y)/view.k}}
/* 手勢 */
let drag=null,pinch=null;const ptrs=new Map();
cv.addEventListener('pointerdown',ev=>{if(document.activeElement===$('tx'))$('tx').blur();ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);cv.setPointerCapture(ev.pointerId);
if(ptrs.size==2){const[a,b]=[...ptrs.values()];drag=null;pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,k:view.k,mx:(a[0]+b[0])/2,my:(a[1]+b[1])/2,vx:view.x,vy:view.y};return}
if(ptrs.size>2)return;
const p=pt(ev),t=ev.target.closest('[data-h],[data-n],[data-e]');
if(t&&t.dataset.h){const n=N(t.dataset.h);drag={k:'rs',n,ox:p.x-n.w,oy:p.y-n.h}}
else if(t&&t.dataset.n){const n=N(t.dataset.n);
if(mode){if(!linkFrom)linkFrom=n.id;else if(linkFrom!=n.id){if(!S.edges.some(e=>(e.f==linkFrom&&e.t==n.id)||(e.f==n.id&&e.t==linkFrom))){S.edges.push({f:linkFrom,t:n.id});commit()}linkFrom=null}else linkFrom=null;render();drag=null;return}
sel={t:'n',id:n.id};drag={k:'mv',n,ox:p.x-n.x,oy:p.y-n.y,moved:false}}
else if(t&&t.dataset.e){sel={t:'e',i:+t.dataset.e};drag=null}
else{sel=null;linkFrom=null;drag={k:'pan',sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y}}
render()});
cv.addEventListener('pointermove',ev=>{if(ptrs.has(ev.pointerId))ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);
if(pinch&&ptrs.size==2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),k=Math.min(3,Math.max(.2,pinch.k*d/pinch.d)),r=cv.getBoundingClientRect(),wx=(pinch.mx-r.left-pinch.vx)/pinch.k,wy=(pinch.my-r.top-pinch.vy)/pinch.k;
view.k=k;view.x=(a[0]+b[0])/2-r.left-wx*k;view.y=(a[1]+b[1])/2-r.top-wy*k;render();return}
if(!drag)return;const p=pt(ev);
if(drag.k=='pan'){view.x=drag.vx+ev.clientX-drag.sx;view.y=drag.vy+ev.clientY-drag.sy}
else if(drag.k=='mv'){drag.n.x=Math.round((p.x-drag.ox)/10)*10;drag.n.y=Math.round((p.y-drag.oy)/10)*10;drag.moved=true}
else{drag.n.w=Math.max(40,Math.round((p.x-drag.ox)/10)*10);drag.n.h=Math.max(40,Math.round((p.y-drag.oy)/10)*10);drag.moved=true}
render()});
const up=ev=>{ptrs.delete(ev.pointerId);if(ptrs.size<2)pinch=null;
if(drag){if(drag.k!='pan'){if(drag.moved)commit();else if(drag.k=='mv')vis(drag.n)}drag=null}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',ev=>{ev.preventDefault();zoom(ev.deltaY<0?1.1:.9)},{passive:false});
function zoom(f){const r=cv.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,k=Math.min(3,Math.max(.2,view.k*f));view.x=cx-(cx-view.x)*k/view.k;view.y=cy-(cy-view.y)*k/view.k;view.k=k;render()}
function fit(){const b=bbox(),r=cv.getBoundingClientRect(),k=Math.min(1.5,Math.min((r.width-40)/b.w,(r.height-40)/b.h));view.k=k;view.x=(r.width-b.w*k)/2-b.x*k;view.y=(r.height-b.h*k)/2-b.y*k;render()}
$('bZi').onclick=()=>zoom(1.2);$('bZo').onclick=()=>zoom(1/1.2);$('bFit').onclick=fit;
$('bLink').onclick=()=>{mode=mode?0:1;linkFrom=null;render()};
$('bUn').onclick=doUndo;$('bRe').onclick=doRedo;
$('title').onclick=()=>{const n=prompt('結構名稱',S.name);if(n&&n.trim()){S.name=n.trim();commit();render()}};
/* 新增與編輯 */
function free(x,y,w,h){let t=0;while(S.nodes.some(m=>x<m.x+m.w+10&&x+w+10>m.x&&y<m.y+m.h+10&&y+h+10>m.y)&&t++<200)y+=h+16;return y}
function mk(p,x,y,w=140,h=56){const n={id:uid(),text:'新方框',x:Math.round(x/10)*10,y:Math.round(y/10)*10,w,h,v:0};
if(p)['r','sh','ff','fs','fb','te','tc','c'].forEach(k=>{if(p[k]!==undefined)n[k]=p[k]});return n}
function edit(n){sel={t:'n',id:n.id};commit();render();vis(n);setTimeout(()=>{$('tx').focus();$('tx').select()},80)}
$('bAdd').onclick=()=>{const r=cv.getBoundingClientRect(),n=mk(curN(),(r.width/2-view.x)/view.k-70,(r.height/3-view.y)/view.k-28);n.y=free(n.x,n.y,n.w,n.h);S.nodes.push(n);edit(n)};
function addChild(){const p=curN();if(!p)return;const x=p.x+p.w+60,n=mk(p,x,p.y+(p.h-56)/2);n.y=free(n.x,n.y,n.w,n.h);S.nodes.push(n);S.edges.push({f:p.id,t:n.id});edit(n)}
function addSib(){const p=curN();if(!p)return;const n=mk(p,p.x,p.y+p.h+16,p.w,p.h);n.v=p.v;n.y=free(n.x,n.y,n.w,n.h);S.nodes.push(n);const pe=S.edges.find(e=>e.t==p.id);if(pe)S.edges.push({f:pe.f,t:n.id});edit(n)}
$('aChild').onclick=addChild;$('aSib').onclick=addSib;
$('aDup').onclick=()=>{const p=curN();if(!p)return;const n=JSON.parse(JSON.stringify(p));n.id=uid();n.x+=20;n.y+=20;S.nodes.push(n);sel={t:'n',id:n.id};commit();render()};
$('aDir').onclick=()=>{const n=curN();if(!n)return;n.v=n.v?0:1;[n.w,n.h]=[n.h,n.w];commit();render()};
function delSel(){if(!sel)return;if(sel.t=='n'){S.nodes=S.nodes.filter(n=>n.id!=sel.id);S.edges=S.edges.filter(e=>e.f!=sel.id&&e.t!=sel.id)}else S.edges.splice(sel.i,1);sel=null;commit();render()}
$('aDel').onclick=delSel;$('eDel').onclick=delSel;
$('eArw').onclick=()=>{const e=S.edges[sel.i];e.a=e.a?0:1;commit();render()};
$('eRev').onclick=()=>{const e=S.edges[sel.i];[e.f,e.t]=[e.t,e.f];commit();render()};
/* 面板控制 */
function bindN(id,fn){const el=$(id);el.addEventListener('input',()=>{const n=curN();if(!n)return;fn(n,el);save();render()});el.addEventListener('change',commit)}
bindN('tx',(n,e)=>n.text=e.value);bindN('sR',(n,e)=>n.r=+e.value);bindN('sZ',(n,e)=>n.fs=+e.value);bindN('sFf',(n,e)=>n.ff=+e.value);
$('sB').onclick=()=>{const n=curN();if(n){n.fb=n.fb?0:1;commit();render()}};
$('sSh').onclick=e=>{const v=e.target.dataset.v,n=curN();if(v!=null&&n){n.sh=+v;commit();render()}};
$('sTe').onclick=e=>{const v=e.target.dataset.v,n=curN();if(v!=null&&n){n.te=+v;commit();render()}};
$('tabs').onclick=e=>{if(e.target.dataset.t!=null){tab=+e.target.dataset.t;render()}};
function mkSw(id,cols,fn){$(id).innerHTML=cols.map(c=>`<button class="sw" data-c="${c}" style="background:${c}"></button>`).join('');$(id).onclick=e=>{const c=e.target.dataset.c;if(c)fn(c)}}
mkSw('sFill',['#ffffff','#ffe3e3','#ffc9c9','#fff3bf','#d3f9d8','#d0ebff','#a5d8ff','#e5dbff','#ffd8a8','#dee2e6'],c=>{const n=curN();if(n){n.c=c;commit();render()}});
mkSw('sTc',['#111111','#ffffff','#d9480f','#1c7ed6','#2f9e44','#9c36b5','#e67700'],c=>{const n=curN();if(n){n.tc=c;commit();render()}});
mkSw('eCol',['#222222','#d9480f','#1c7ed6','#2f9e44','#9c36b5','#868e96'],c=>{if(sel&&sel.t=='e'){S.edges[sel.i].c=c;commit();render()}});
$('sAll').onclick=()=>{const n=curN();if(!n)return;S.nodes.forEach(m=>['r','sh','ff','fs','fb','te','tc'].forEach(k=>m[k]=n[k]));commit();render();toast('已套用到全部方框')};
/* 選單與檔案 */
function menu(btn,items){const m=$('menu');if(!m.hidden&&m.dataset.f==btn.id){m.hidden=true;return}
m.dataset.f=btn.id;m.innerHTML=items.map((x,i)=>`<button data-i="${i}">${x[0]}</button>`).join('');const r=btn.getBoundingClientRect();m.style.left=Math.max(6,Math.min(r.left,innerWidth-186))+'px';m.hidden=false;m.onclick=e=>{const i=e.target.dataset.i;if(i!=null){m.hidden=true;items[i][1]()}}}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#bFile,#bExp'))$('menu').hidden=true},true);
const saves=()=>{try{return JSON.parse(localStorage.getItem('sd_saves'))||{}}catch(e){return{}}};
function saveAs(name){const s=saves();S.name=name;s[name]=JSON.parse(JSON.stringify(S));localStorage.setItem('sd_saves',JSON.stringify(s));commit();save();render();toast('已儲存「'+name+'」')}
function saveAsP(){const n=prompt('結構名稱',S.name);if(n&&n.trim())saveAs(n.trim())}
function saveCur(){S.name&&S.name!='未命名'&&S.name!='範例'?saveAs(S.name):saveAsP()}
function openList(){const s=saves();$('fl').innerHTML=Object.keys(s).map(k=>`<div class="lr"><span>${esc(k)}</span><span><button data-o="${esc(k)}">開啟</button><button data-x="${esc(k)}">刪除</button></span></div>`).join('')||'<div style="color:#888;padding:8px 0">尚無儲存的結構</div>';$('dL').showModal()}
$('fl').onclick=e=>{const s=saves(),o=e.target.dataset.o,x=e.target.dataset.x;
if(o){S=JSON.parse(JSON.stringify(s[o]));S.name=o;sel=null;resetHist();save();fit();$('dL').close()}
if(x&&confirm('刪除「'+x+'」？')){delete s[x];localStorage.setItem('sd_saves',JSON.stringify(s));openList()}};
$('fClose').onclick=()=>$('dL').close();
function newDoc(){if(confirm('建立新的空白結構？（目前內容已自動暫存，未儲存的會被取代）')){S={name:'未命名',nodes:[],edges:[]};sel=null;resetHist();save();render()}}
$('bFile').onclick=e=>menu(e.currentTarget,[['新建',newDoc],['儲存',saveCur],['另存新檔…',saveAsP],['我的結構…',openList],['匯入檔案…',()=>$('fi').click()]]);
$('fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw 0;S={name:d.name||f.name.replace(/\.json$/,''),nodes:d.nodes,edges:d.edges};sel=null;resetHist();save();fit();toast('已匯入')}catch(x){alert('檔案格式不正確')}};
/* 匯出 */
const exJson=()=>saveFile(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),(S.name||'結構圖')+'.json','結構圖資料','.json');
function exPdf(){if(!S.nodes.length)return alert('目前沒有內容');const o=svgStr(1),land=o.b.w>=o.b.h;
let st=document.getElementById('ps');if(!st){st=document.createElement('style');st.id='ps';document.head.appendChild(st)}
st.textContent=`@page{size:A4 ${land?'landscape':'portrait'};margin:8mm}@media print{#pb svg{max-height:${land?190:277}mm}}`;
$('pb').innerHTML=o.s;setTimeout(()=>window.print(),100)}
function exPng(){if(!S.nodes.length)return alert('目前沒有內容');const o=svgStr(2),img=new Image();
img.onload=()=>{const c=document.createElement('canvas');c.width=o.w*2;c.height=o.h*2;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0);c.toBlob(bl=>saveFile(bl,(S.name||'結構圖')+'.png','PNG 圖片','.png'))};
img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(o.s)}
$('bExp').onclick=e=>menu(e.currentTarget,[['PDF（列印）',exPdf],['PNG 圖片',exPng],['資料檔 JSON',exJson]]);
/* 鍵盤 */
addEventListener('keydown',e=>{const t=e.target.tagName;if(t=='TEXTAREA'||t=='INPUT'||t=='SELECT')return;const c=e.ctrlKey||e.metaKey;
if(c&&e.key.toLowerCase()=='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}else if(c&&e.key.toLowerCase()=='y'){e.preventDefault();doRedo()}
else if(e.key=='Delete'||e.key=='Backspace')delSel();else if(e.key=='Escape'){sel=null;mode=0;render()}
else if(e.key=='Tab'&&curN()){e.preventDefault();addChild()}else if(e.key=='Enter'&&curN()){e.preventDefault();addSib()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();resetHist();render();setTimeout(fit,60);
</script></body></html>
